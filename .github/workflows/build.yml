name: Build and Package Sandtrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'

      - name: Set up Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Sandtrix
        run: |
          cmake --build build --config Release

      - name: Deploy Qt Dependencies (windeployqt)
        shell: bash
        run: |
          windeployqt --no-translations --compiler-runtime build/sandtrix.exe

      - name: Package Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item -Path "build\*" -Destination "dist\" -Recurse -Exclude "*.obj","*.o","*.ninja*","CMakeFiles"
          Compress-Archive -Path "dist\*" -DestinationPath "sandtrix-windows-x64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandtrix-windows-x64
          path: sandtrix-windows-x64.zip
